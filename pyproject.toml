[project]
name = "netspot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.2",
    "bcrypt>=5.0.0",
    "dnspython>=2.8.0",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "psutil>=5.9.8",
    "pysnmp>=7.1.22",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.40.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "pillow>=10.0.0",
]
llm = [
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "peft>=0.12.0",
    "datasets>=2.20.0",
    "accelerate>=0.33.0",
]
# QLoRA 4 bits: só em Linux + CUDA (instalar bitsandbytes no ambiente de treino).
qlora = [
    "bitsandbytes>=0.43.0",
]
# Laboratório emulado (fases 10–12): rede Kathará + Docker.
kathara = [
    "kathara>=3.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: testes que exigem Docker em execução (Kathará)",
]
