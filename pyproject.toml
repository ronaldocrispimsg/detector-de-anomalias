[project]
name = "netspot-anomaly-detector"
version = "1.1.1"
description = "NetSpot - Sistema Inteligente de Monitoramento de Rede com Detecção e Classificação de Anomalias"
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aio-pika>=9.4.0",
    "apscheduler>=3.11.2",
    "asyncpg>=0.29.0",
    "bcrypt>=5.0.0",
    "dnspython>=2.8.0",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "psutil>=5.9.8",
    "psycopg2-binary>=2.9.9",
    "psycopg[binary]>=3.1.0",
    "pysnmp>=7.1.22",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.5.0",
    "requests>=2.32.5",
    "greenlet>=3.0.0",
    "sqlalchemy[asyncio]>=2.0.46",
    "uvicorn[standard]>=0.40.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "pillow>=10.0.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "pillow>=10.0.0",
]
llm = [
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "peft>=0.12.0",
    "datasets>=2.20.0",
    "accelerate>=0.33.0",
]
qlora = [
    "bitsandbytes>=0.43.0",
]
kathara = [
    "kathara>=3.7.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["Backend/tests", "Backend/services/agent/tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: testes que exigem Docker em execução (Kathará)",
]
